<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>KVL</title>
    
    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 0;
            color: #f9f7f7;
            background-color: #000000;
        }
        h2{
            margin-top: -15px;
            margin-bottom: 0px;
        }

        nav ul{
            list-style-type: none;
            margin: 0;
            padding: 0;
            background-color:#000000;
            display: flex;
        }
      h1 {
        text-align: center;
      }

      /* The C Terminal Styling */
      #output {
        width: 100%;
        max-width: 600px;
        height: 250px;
        margin: 20px auto;
        display: block;
        background-color: black;
        color: white; 
        font-family: 'Lucida Console', Monaco, monospace;
        font-size: 16px;
        border: 2px solid #333;
        padding: 10px;
        outline: none;
        border-radius: 5px;
      }


      button{
        height: 40px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background-color: #f6f4f4;
        color: #000000;
        border: none;
        border-radius: 5px;
      }


      button:hover{
        background-color: #45a049;
      }


      .button-row{
        display: flex;
        justify-content: center;
        text-align: center;
        gap: 30px; 
        margin-bottom: 15px; 
      }

      button:disabled {
        background-color: #555555; /* Dark gray to look "turned off" */
        color: #888888;            /* Dimmed text */
        cursor: not-allowed;       /* Changes the mouse pointer to a red circle/slash */
      }

    </style>

    <script type="text/javascript">
  // 1. Track the state of your buttons
  let Vpressed = false;
  let Rpressed = false;
  let Ispressed = false;
  let start = false;
  let reset = false;
  let unknown = false;
  let V_x = false;
  let R_x = false;


  // 2. Check if both are true, then reveal
  function checkCalculateReveal() {
    if (Vpressed === true && Rpressed === true && Ispressed ===true) {
      document.getElementById('calc_btn').style.display = 'inline-block';
    }
  }


  function checkStart(){
    if (start === true){
      document.getElementById('reset').style.display = 'inline-block';
      document.getElementById('unknown').style.display = 'inline-block';
      document.getElementById('start').style.display = 'none';

    }
  }


  function checkUnknown(){
    if (unknown === true){
      document.getElementById('V_x').style.display = 'inline-block';
      document.getElementById('R_x').style.display = 'inline-block';
      document.getElementById('unknown').style.display = 'none';
    }
  }

  function checkV_x(){
    if (V_x === true){
      document.getElementById('triggerR').style.display = 'inline-block';
      document.getElementById('triggerV').style.display = 'inline-block';
      document.getElementById('insertR').style.display = 'inline-block';
      document.getElementById('Isource').style.display = 'inline-block';
      document.getElementById('more').style.display = 'inline-block';

      document.getElementById('R_x').style.display = 'none';
      document.getElementById('V_x').style.display = 'none';
    }
  }


  function checkR_x(){
    if(R_x === true){
      document.getElementById('triggerR').style.display = 'inline-block';
      document.getElementById('triggerV').style.display = 'inline-block';
      document.getElementById('insertV').style.display = 'inline-block';
      document.getElementById('Isource').style.display = 'inline-block';
      document.getElementById('more').style.display = 'inline-block';

      document.getElementById('R_x').style.display = 'none';
      document.getElementById('V_x').style.display = 'none';
    }
  }

  function checkReset(){
    if(reset === true){
      document.getElementById('R_x').style.display = 'none';
      document.getElementById('V_x').style.display = 'none';
      document.getElementById('triggerR').style.display = 'none';
      document.getElementById('triggerV').style.display = 'none';
      document.getElementById('insertV').style.display = 'none';
      document.getElementById('insertR').style.display = 'none';
      document.getElementById('Isource').style.display = 'none';
      document.getElementById('more').style.display = 'none';
      document.getElementById('calc_btn').style.display = 'none';
      document.getElementById('unknown').style.display = 'none';


      

      document.getElementById('start').style.display = 'inline-block';

    }
  }

  // 3. Custom functions for your buttons

  function triggerStart() {
    Module._node();      // Run C code
    start = true;  // Mark as pressed
    reset = false;
    checkStart();  // Check if we should reveal the button
  }

  function triggerReset(){
    Module._node();

Vpressed = false;
Rpressed = false;
Ispressed = false;
unknown = false;
V_x = false;
R_x = false;
start = false;


    reset = true;
    checkReset();
  }

  function triggerUnknown(){
    unknown = true;
    checkUnknown();
  }

  function triggerV_x(){
    V_x = true;
    checkV_x();
  }

  function triggerR_x(){
    R_x = true;
    checkR_x();
  }

  function triggerV() {
    Module._insertV();      // Run C code
    Vpressed = true;  // Mark as pressed
    checkCalculateReveal();  // Check if we should reveal the button
  }

  function triggerR() {
    Module._insertR();     // Run C code
    Rpressed = true; // Mark as pressed
    checkCalculateReveal();  // Check if we should reveal the button
  }

  function triggerIs(){
    Module._insertIs();
    Ispressed = true;
    checkCalculateReveal();
  }

  function addmore(){
    Vpressed = false;
    Rpressed = false;
    document.getElementById('calc_btn').style.display = 'none';
    document.getElementById('triggerV').disabled = false;
    document.getElementById('triggerR').disabled = false;
    
  
  }


    </script>

  </head>
  <body>

    <h1>KVL</h1>
    <div class = "button-row">

    <button id="start" onclick="triggerStart();">Start</button>

    <button id="reset" onclick="triggerReset();"style="display: none;" onclick="Module._node()">Reset</button>
    </div>


    <div class = "button-row">

    <!--Asking for the unknown -->
    <button id = "unknown" style="display: none;" onclick="triggerUnknown();">Unknown</button>

    <button id = "V_x" style="display: none;" onclick="triggerV_x();">V<sub>x</sub></button>

    <button id = "R_x" style="display: none;" onclick="triggerR_x();">R<sub>x</sub></button>



    <button id="triggerR" style="display: none;" onclick="triggerR();this.disabled = true;">Insert R</button>

    <button id="triggerV"  style="display: none;" onclick="triggerV();this.disabled = true;">Insert V</button>


    <button id= "insertR" style="display: none;" onclick="Module._insertRx();this.disabled = true;">Resistance at V<sub>x</sub></button>

    <button id= "insertV" style="display: none;" onclick="Module._insertVx();this.disabled = true;">Resistance at V<sub>x</sub></button>
 

    <button id = "Isource" style="display: none;" onclick="triggerIs();this.disabled = true;"> Add I source</button>

    <button id="more" style="display: none;" onclick="addmore()"> Add more</button>


    <button id="calc_btn" style="display: none;" onclick="Module._calculate()">Calculate</button>

    </div>
    
    <!-- The Terminal Box -->
    <textarea id="output" rows="12" readonly></textarea>

    <!-- The bare minimum JavaScript to connect C to the Textarea -->
    <script type='text/javascript'>
      var outputElement = document.getElementById('output');
      if (outputElement) outputElement.value = ''; // clear on reload

      var Module = {
        print: function(...args) {
          var text = args.join(' ');
          if (outputElement) {
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight; // Auto-scroll to bottom
          }
        }
      };

    </script>

    <script async type="text/javascript" src="node_analysis.js"></script>

    <li><a style="font-size: 24px;" href="/index.html">Index</a></li>
    
  </body>
</html>
